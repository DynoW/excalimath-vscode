version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    versioning-strategy: increase
    groups:
      all-deps:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: /webview
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    versioning-strategy: increase
    groups:
      all-deps:
        patterns:
          - "*"
